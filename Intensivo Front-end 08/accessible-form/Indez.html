<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Acessível</title>
    <link rel="stylesheet" href="StyleIndez08.css">
</head>
<body>
    <form aria-label="Formulário de Configuração de Conta">
        <h2>Acessibilidade Estrita</h2>
        <div class="accessible-group">
            <label Over for="password">Senha de Acesso</label>
            <input type="password" id="password" aria-required="true" aria-describedby="password-hint" required>
            <span id="password-hint" class="hint-text">A senha deve conter no mínimo 8 caracteres, incluindo pelo menos uma letra e um número.</span>
        </div>
        <button type="submit" aria-label="Enviar formulário de segurança da conta">Salvar Senha</button>
    </form>
</body>
</html>
