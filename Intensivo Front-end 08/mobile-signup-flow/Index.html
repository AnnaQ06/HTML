<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo Mobile-First</title>
    <link rel="stylesheet" href="StyleIndex08 4.css">
</head>
<body>
    <div class="mobile-container">
        <h2>Passo 1/2: Seus Dados</h2>
        <form class="mobile-first-form">
            <label for="phone">Telefone Celular</label>
            <input type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999" required>
            
            <label for="birth">Data de Nascimento</label>
            <input type="date" id="birth" required>
            
            <button type="submit" class="btn-mobile-next">Avançar</button>
        </form>
    </div>
</body>
</html>
