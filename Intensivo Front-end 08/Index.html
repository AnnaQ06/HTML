<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redesign de Formulário</title>
    <link rel="stylesheet" href="IndexStyle08 1.css">
</head>
<body>

    <form class="ux-form">
        <h2>Cadastro de Usuário</h2>
        <div class="form-group">
            <label for="username">Nome Completo</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ex: João Silva"
                autocomplete="name"
                required
            >
        </div>
        <div class="form-group">
            <label for="useremail">E-mail Corporativo</label>

            <input
                type="email"
                id="useremail"
                name="useremail"
                placeholder="nome@empresa.com"
                autocomplete="email"
                required
            >
        </div>
        <button type="submit" class="btn-primary">
            Concluir Cadastro
        </button>
    </form>

</body>
</html>
